<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09100f"><meta name="description" content="A Rust/WebAssembly cloth simulation driven by physical browser and phone motion"><title>WASM Cloth Lab</title></head>
<body>
<canvas id="scene" aria-label="Interactive cloth simulation"></canvas>
<header><div class="brand"><b>WASM</b> CLOTH LAB</div><button id="settings" aria-label="Toggle controls" aria-expanded="false">TUNE</button></header>
<main><div class="hint"><strong id="hint-title">Grab this window and move it.</strong><span id="hint-detail">Your browser movement becomes wind.</span></div></main>
<aside id="panel" aria-label="Simulation controls">
<button id="enable-motion" class="motion-enable" hidden>Enable phone motion</button><small id="motion-status" class="motion-status" hidden></small>
<div class="control"><label for="material">Material</label><select id="material"><option value="0">Silk</option><option value="1" selected>Cotton</option><option value="2">Heavy canvas</option><option value="3">Nylon flag</option><option value="4">Rubber sheet</option></select></div>
<div class="control"><label for="quality">Quality</label><select id="quality"><option value="0">Low · 30 × 20</option><option value="1">Medium · 50 × 32</option><option value="2">High · 75 × 48</option><option value="3">Ultra · 100 × 64</option></select></div>
<div class="control"><label for="attachment">Attachment</label><select id="attachment"><option value="0">Full edge</option><option value="1">Two point</option><option value="2">Top edge</option></select></div>
<div class="control"><label for="wind">Ambient wind <output id="wind-out">2.2</output></label><input id="wind" type="range" min="0" max="8" step=".1" value="2.2"></div>
<div class="control"><label for="motion"><span id="motion-label">Window wind</span> <output id="motion-out">1.0</output></label><input id="motion" type="range" min="0" max="2" step=".05" value="1"></div>
<div class="control"><label for="inertia"><span id="inertia-label">Window inertia</span> <output id="inertia-out">1.0</output></label><input id="inertia" type="range" min="0" max="2" step=".05" value="1"></div>
<div class="actions"><button id="reset">Reset cloth <kbd>R</kbd></button><button id="gust">Gust <kbd>F</kbd></button><button id="debug">Debug <kbd>D</kbd></button></div>
<hr><label class="upload">Choose flag image<input id="image" type="file" accept="image/*"></label><small>Images stay in your browser and are never uploaded.</small>
</aside><pre id="metrics" hidden></pre><div id="error" role="alert" hidden></div><script type="module" src="/src/main.ts"></script>
</body></html>
